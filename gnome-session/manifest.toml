# manifest.toml - gnome-session (syshub tier)

[package]
name             = "gnome-session"
version          = "49.3"
description      = "GNOME session manager, systemd-optional build (elogind/qlogind)"
license          = "GPL-2.0-or-later"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.gnome.org/GNOME/gnome-session"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["glib", "gnome-desktop", "gsettings-desktop-schemas", "gnome-settings-daemon", "dbus", "quantra-logind"]
provides         = ["gnome-session"]
tags             = ["gnome", "desktop", "session"]

[install]
bin     = "/overlayer/syshub/bin"
lib     = "/overlayer/syshub/lib"
libexec = "/overlayer/syshub/libexec"
share   = "/overlayer/syshub/share"
etc     = "/overlayer/syshub/etc"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
