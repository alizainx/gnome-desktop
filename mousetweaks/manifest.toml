# manifest.toml - mousetweaks (syshub tier)

[package]
name             = "mousetweaks"
version          = "3.32.0"
description      = "Mouse accessibility enhancements for the GNOME desktop"
license          = "GPL-3.0-or-later"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://wiki.gnome.org/Projects/Mousetweaks"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["glib", "gtk3", "gsettings-desktop-schemas", "libx11", "libxtst", "libxfixes", "libxcursor"]
provides         = ["mousetweaks"]
tags             = ["gnome", "accessibility", "app"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
