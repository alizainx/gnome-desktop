# syshub-recipes — GitHub Actions CI/CD
#
# Same shape as userland-recipes' pipeline (see that repo for the full
# history of why each piece is here) — only ever builds packages whose
# directory actually changed (see ci/changed-packages.sh), runs inside
# an Alpine container so `--host="$CHOST"` (or an explicit config.mak,
# for Makefile-only builds) produces genuinely musl-linked binaries
# instead of glibc ones wearing a musl interpreter string, and verifies
# that on every ELF before packing. `libc6-compat` goes in first, before
# anything else — GitHub's runner injects a glibc-built Node binary into
# every container job to run JS actions (actions/checkout,
# actions/upload-artifact), which silently fails on bare Alpine without it.
#
# Curated, not open-fork: this repo is the base OS (syshub), not the
# public "anyone can add a package" surface userland-recipes is — the
# check/release split and CI mechanics are identical anyway, since
# what's actually different (manifest.toml's `_syshub = true`, install
# paths under /overlayer/syshub/..., `native = true` for self-hosting
# toolchain packages) lives entirely in each recipe, not in this pipeline.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Container prerequisites (glibc shim for actions' Node runtime)
        run: |
          apk add --no-cache libc6-compat git bash
          # actions/checkout sets safe.directory under a *temporary* HOME
          # that only exists during its own (Node) process — every later
          # `run:` step uses the container's real HOME, where that trust
          # entry never landed, so plain `git` calls in later steps
          # (ci/changed-packages.sh, ci/build.sh) fail with "detected
          # dubious ownership". Trust it globally, permanently, up front —
          # this container is single-use/thrown away per job anyway.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          apk add --no-cache build-base texinfo xz zstd zlib-dev curl-dev expat-dev linux-headers rust cargo \
            gmp-dev mpfr-dev mpc1-dev isl-dev bison flex m4 perl \
            cmake samurai meson python3 libxml2-dev ncurses-dev zstd-dev libedit-dev coreutils pkgconf
          # samurai provides /usr/bin/ninja — Alpine has no "ninja" package
          # by name, this is the actual ninja-build implementation there.
          # gmp/mpfr/mpc/isl are gcc's own hard build deps; cmake/samurai/
          # python3/libxml2/ncurses/zstd/libedit cover LLVM's CMake build.
          # zstd (the CLI, not just zstd-dev) is what GNU tar shells out
          # to for .tar.zst auto-decompression (binutils-2.47.tar.zst).
          # Package-specific C deps go in that recipe's own makedepends=,
          # not here — see ci/build.sh.
          # `cargo install` puts binaries in ~/.cargo/bin — nothing on
          # Alpine's own apk rust/cargo adds that to PATH for you.
          # GITHUB_PATH persists for every later step in this job.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo (registry + installed binaries)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-check-${{ runner.os }}-v1

      # substrate is published on crates.io (substrate-zainium, binary
      # name substrate) — install straight from there.
      - name: Install substrate
        run: cargo install substrate-zainium --locked

      - name: Build changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pkgs_out="$(mktemp)"
          if ! sh ci/changed-packages.sh > "$pkgs_out"; then
            echo "changed-packages.sh failed:"
            cat "$pkgs_out"
            exit 1
          fi
          failed=""
          for pkg in $(cat "$pkgs_out"); do
            echo "=== check build: $pkg ==="
            sh ci/build.sh "$pkg" || failed="$failed $pkg"
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi

      # check builds never publish (no PUBLISH=1 here) — this is the
      # only way to get the actual .zex out of a PR build for local
      # inspection (`substrate inspect`/`unpack`) before deciding to
      # merge. ci/build.sh leaves finished .zex files at the repo root.
      - name: Upload built .zex(es)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: built-zex
          path: "*.zex"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload staging on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zexbuild-staging
          path: .zexbuild-staging/
          retention-days: 1
          include-hidden-files: true

  # gnome-desktop's release job never publishes to Zainium's live
  # package server (no PUBLISH=1, no zex-ports, no R2 secrets) — it
  # builds every changed package, packs each into a .zex, and attaches
  # them to a GitHub Release instead. Download from the release, drop
  # into the OS root, build the ISO.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container: alpine:latest
    permissions:
      contents: write
    steps:
      - name: Container prerequisites (glibc shim for actions' Node runtime)
        run: |
          apk add --no-cache libc6-compat git bash
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          apk add --no-cache build-base texinfo xz zstd zlib-dev curl-dev expat-dev linux-headers rust cargo \
            gmp-dev mpfr-dev mpc1-dev isl-dev bison flex m4 perl \
            cmake samurai meson python3 libxml2-dev ncurses-dev zstd-dev libedit-dev coreutils pkgconf
          # Package-specific C deps go in that recipe's own makedepends=,
          # not here — see ci/build.sh.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo (registry + installed binaries)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-release-${{ runner.os }}-v1

      - name: Install substrate
        run: cargo install substrate-zainium --locked

      - name: Build changed packages
        env:
          # github.event.before is the SHA the branch was at right before
          # this push — covers every commit in the push, not just the
          # last one. Without this, changed-packages.sh's HEAD~1 fallback
          # only ever sees the final commit's diff, so pushing several
          # commits at once (or the very first push of a repo's full
          # history, where `before` is the all-zero SHA and this env var
          # ends up empty, falling through to changed-packages.sh's own
          # HEAD~1 default) silently drops everything else.
          BASE_SHA: ${{ github.event.before }}
        run: |
          pkgs_out="$(mktemp)"
          if ! sh ci/changed-packages.sh > "$pkgs_out"; then
            echo "changed-packages.sh failed:"
            cat "$pkgs_out"
            exit 1
          fi
          failed=""
          first=1
          for pkg in $(cat "$pkgs_out"); do
            if [ "$first" -eq 0 ]; then
              echo "-- waiting 60s before the next package --"
              sleep 60
            fi
            first=0
            echo "=== release build: $pkg ==="
            sh ci/build.sh "$pkg" || failed="$failed $pkg"
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi

      - name: Upload staging on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zexbuild-staging
          path: .zexbuild-staging/
          retention-days: 1
          include-hidden-files: true

      # .zex files sit at the repo root once ci/build.sh finishes. Tag
      # each release by commit SHA so re-running this workflow on a new
      # push never collides with a prior release tag.
      - name: Create GitHub Release with built .zex files
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: build-${{ github.sha }}
          files: "*.zex"
          fail_on_unmatched_files: false
