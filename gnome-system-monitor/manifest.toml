# manifest.toml - gnome-system-monitor (syshub tier)

[package]
name             = "gnome-system-monitor"
version          = "50.0"
description      = "Process, resource, and file-system monitor for GNOME"
license          = "GPL-2.0-or-later"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://apps.gnome.org/SystemMonitor/"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["glibmm", "glib", "gtk4", "gtkmm4", "libgtop", "libadwaita", "librsvg", "polkit"]
provides         = ["gnome-system-monitor"]
tags             = ["gnome", "monitor", "app"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
