# manifest.toml - tecla (syshub tier)

[package]
name             = "tecla"
version          = "49.0"
description      = "Keyboard layout viewer for GNOME"
license          = "GPL-2.0-or-later"
maintainer       = "Ali Zain <alizain@zainiumdynamics.tech>"
homepage         = "https://gitlab.gnome.org/GNOME/tecla"
build_type       = "dynamic"
libc_target      = "musl"

blake3           = ""
ed25519_sig      = ""
ed25519_pubkey   = ""

depends          = ["gtk4", "libadwaita", "libxkbcommon"]
provides         = ["tecla"]
tags             = ["gnome", "keyboard", "app"]

[install]
bin     = "/overlayer/syshub/bin"
share   = "/overlayer/syshub/share"
_syshub = true

[remove]
files    = []
dirs     = []
symlinks = []

[hooks]
